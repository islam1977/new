name: Binance Early Pump Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-early-pump
  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-slim

    timeout-minutes: 4

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

       - name: Test Binance access
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://api.binance.com/api/v3/ping",
              "https://api1.binance.com/api/v3/ping",
              "https://api2.binance.com/api/v3/ping",
              "https://api3.binance.com/api/v3/ping",
              "https://api4.binance.com/api/v3/ping",
          ]

          for url in urls:
              try:
                  r = requests.get(url, timeout=10)
                  print(url, "=>", r.status_code, r.text[:200])
              except Exception as e:
                  print(url, "=> ERROR:", e)
          PY
        

      - name: Save scanner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json early_pump_results.csv

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update scanner state [skip ci]"
            git push
          fi
